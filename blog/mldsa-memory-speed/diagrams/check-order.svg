<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Reordering the rejection checks</title><desc id="desc">Checking r0 before z stops 69% of ML-DSA-65 attempts before z is computed, instead of computing z first and rejecting 42% of attempts afterwards.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5c7"/></marker></defs><rect width="900" height="470" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#fb923c" font-size="18" font-weight="700" text-anchor="start"><tspan x="38" dy="0">REJECTION CHECKS  •  same output, less wasted work</tspan></text><text x="38" y="80" fill="#fdba74" font-size="15" font-weight="700" text-anchor="start"><tspan x="38" dy="0">FIPS 204 order: z first</tspan></text><rect x="38" y="94" width="170" height="62" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="123.0" y="121" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="123.0" dy="0">y, w = Ây, c</tspan></text><text x="123.0" y="142" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="123.0" dy="0">every attempt</tspan></text><path d="M208 125 H236" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><rect x="238" y="94" width="200" height="62" rx="12" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="338.0" y="121" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="338.0" dy="0">z = y + c·s1</tspan></text><text x="338.0" y="142" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="338.0" dy="0">L mults + invNTT</tspan></text><path d="M438 125 H466" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><rect x="468" y="94" width="200" height="62" rx="12" fill="#1d2a3d" stroke="#f87171" stroke-width="2"/><text x="568.0" y="121" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="568.0" dy="0">r0 = w0 − c·s2</tspan></text><text x="568.0" y="142" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="568.0" dy="0">K mults + invNTT</tspan></text><path d="M668 125 H696" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><rect x="698" y="94" width="164" height="62" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="780.0" y="121" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="780.0" dy="0">c·t0, hint h</tspan></text><text x="780.0" y="142" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="780.0" dy="0">almost never fails</tspan></text><text x="338" y="180" fill="#93c5fd" font-size="13" font-weight="400" text-anchor="middle"><tspan x="338" dy="0">38% of attempts stop here</tspan></text><text x="568" y="180" fill="#f87171" font-size="13" font-weight="400" text-anchor="middle"><tspan x="568" dy="0">42% stop here, after z was computed</tspan></text><text x="38" y="230" fill="#fdba74" font-size="15" font-weight="700" text-anchor="start"><tspan x="38" dy="0">Reordered: r0 first</tspan></text><rect x="38" y="244" width="170" height="62" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="123.0" y="271" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="123.0" dy="0">y, w = Ây, c</tspan></text><text x="123.0" y="292" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="123.0" dy="0">every attempt</tspan></text><path d="M208 275 H236" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><rect x="238" y="244" width="200" height="62" rx="12" fill="#1d2a3d" stroke="#f87171" stroke-width="2"/><text x="338.0" y="271" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="338.0" dy="0">r0 = w0 − c·s2</tspan></text><text x="338.0" y="292" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="338.0" dy="0">K mults + invNTT</tspan></text><path d="M438 275 H466" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><rect x="468" y="244" width="200" height="62" rx="12" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="568.0" y="271" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="568.0" dy="0">z = y + c·s1</tspan></text><text x="568.0" y="292" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="568.0" dy="0">L mults + invNTT</tspan></text><path d="M668 275 H696" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><rect x="698" y="244" width="164" height="62" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="780.0" y="271" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="780.0" dy="0">c·t0, hint h</tspan></text><text x="780.0" y="292" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="780.0" dy="0">almost never fails</tspan></text><text x="338" y="330" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle"><tspan x="338" dy="0">69% of attempts stop here</tspan></text><text x="568" y="330" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="568" dy="0">only 31% get this far</tspan></text><text x="38" y="400" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="38" dy="0">ML-DSA-65, 20,000 signatures: 5.18 attempts per signature either way. Signing time 390 → 360 µs (−7.6%);</tspan></text><text x="38" y="422" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="38" dy="0">ML-DSA-44 −4.4%, ML-DSA-87 −5.9%. All checks must pass to output a signature, so the result is byte-identical.</tspan></text></g></svg>