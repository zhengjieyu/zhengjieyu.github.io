<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Parallel small polynomial multiplication</title><desc id="desc">Coefficient i of five small polynomials is packed into one 64-bit word in 9-bit lanes, so one word-sized add or subtract processes all five products at once.</desc><rect width="900" height="330" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#fb923c" font-size="18" font-weight="700" text-anchor="start"><tspan x="38" dy="0">PSPM  •  five small polynomials per 64-bit word</tspan></text><text x="38" y="84" fill="#eef2f7" font-size="14" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Usual: c · s1[j] for j = 0..4, each a separate sparse product</tspan></text><rect x="38" y="96" width="154" height="36" rx="8" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="115" y="120" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle"><tspan x="115" dy="0">c · s1[0]</tspan></text><rect x="204" y="96" width="154" height="36" rx="8" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="281" y="120" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle"><tspan x="281" dy="0">c · s1[1]</tspan></text><rect x="370" y="96" width="154" height="36" rx="8" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="447" y="120" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle"><tspan x="447" dy="0">c · s1[2]</tspan></text><rect x="536" y="96" width="154" height="36" rx="8" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="613" y="120" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle"><tspan x="613" dy="0">c · s1[3]</tspan></text><rect x="702" y="96" width="154" height="36" rx="8" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="779" y="120" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle"><tspan x="779" dy="0">c · s1[4]</tspan></text><text x="38" y="172" fill="#eef2f7" font-size="14" font-weight="400" text-anchor="start"><tspan x="38" dy="0">PSPM: coefficient i of all five polynomials, offset to be non-negative, packed into one word</tspan></text><rect x="491.6" y="186" width="110.4" height="44" rx="6" fill="#172638" stroke="#93c5fd" stroke-width="2"/><text x="548.3" y="206" fill="#eef2f7" font-size="13" font-weight="700" text-anchor="middle"><tspan x="548.3" dy="0">s1[0][i]</tspan></text><text x="548.3" y="223" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="548.3" dy="0">9 bits</tspan></text><rect x="378.2" y="186" width="110.4" height="44" rx="6" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="434.9" y="206" fill="#eef2f7" font-size="13" font-weight="700" text-anchor="middle"><tspan x="434.9" dy="0">s1[1][i]</tspan></text><text x="434.9" y="223" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="434.9" dy="0">9 bits</tspan></text><rect x="264.8" y="186" width="110.4" height="44" rx="6" fill="#172638" stroke="#93c5fd" stroke-width="2"/><text x="321.49999999999994" y="206" fill="#eef2f7" font-size="13" font-weight="700" text-anchor="middle"><tspan x="321.49999999999994" dy="0">s1[2][i]</tspan></text><text x="321.49999999999994" y="223" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="321.49999999999994" dy="0">9 bits</tspan></text><rect x="151.4" y="186" width="110.4" height="44" rx="6" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="208.09999999999997" y="206" fill="#eef2f7" font-size="13" font-weight="700" text-anchor="middle"><tspan x="208.09999999999997" dy="0">s1[3][i]</tspan></text><text x="208.09999999999997" y="223" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="208.09999999999997" dy="0">9 bits</tspan></text><rect x="38.0" y="186" width="110.4" height="44" rx="6" fill="#172638" stroke="#93c5fd" stroke-width="2"/><text x="94.69999999999999" y="206" fill="#eef2f7" font-size="13" font-weight="700" text-anchor="middle"><tspan x="94.69999999999999" dy="0">s1[4][i]</tspan></text><text x="94.69999999999999" y="223" fill="#a8b5c7" font-size="12" font-weight="400" text-anchor="middle"><tspan x="94.69999999999999" dy="0">9 bits</tspan></text><rect x="605.0" y="186" width="236.4" height="44" rx="6" fill="none" stroke="#64748b" stroke-dasharray="5 4"/><text x="724.7" y="213" fill="#64748b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="724.7" dy="0">19 spare bits</tspan></text><text x="38" y="262" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Each non-zero ±1 at position j of c becomes one 64-bit add or subtract of the packed S shifted by j (negated past x²⁵⁶).</tspan></text><text x="38" y="284" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Lane width must hold the range of c·s: in ML-DSA-65, |c·s1| ≤ τη = 196, so 2τη = 392 &lt; 2⁹.</tspan></text><text x="38" y="306" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Only integer adds and shifts: plain C is enough.</tspan></text></g></svg>