<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">Stack painting</title><desc id="desc">Fill the stack with a known pattern, run the function, then scan from the far end for the first word that changed. The distance from the initial stack pointer is the peak stack use.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b5c7"/></marker></defs><rect width="900" height="400" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="48" fill="#fb923c" font-size="18" font-weight="700" text-anchor="start"><tspan x="38" dy="0">STACK PAINTING  •  measure the peak, not the guess</tspan></text><text x="140" y="92" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="140" dy="0">1. Fill with a pattern</tspan></text><rect x="70" y="110" width="140" height="240" rx="8" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="140" y="200" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="140" dy="0">0xA5A5A5A5</tspan><tspan x="140" dy="16">0xA5A5A5A5</tspan><tspan x="140" dy="16">0xA5A5A5A5</tspan><tspan x="140" dy="16">...</tspan></text><path d="M230 124 v70" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><text x="238" y="160" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="238" dy="0">SP grows</tspan><tspan x="238" dy="16">down</tspan></text><text x="62" y="122" fill="#64748b" font-size="12" font-weight="400" text-anchor="end"><tspan x="62" dy="0">high</tspan></text><text x="62" y="350" fill="#64748b" font-size="12" font-weight="400" text-anchor="end"><tspan x="62" dy="0">low</tspan></text><text x="420" y="92" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">2. Run the function</tspan></text><rect x="350" y="110" width="140" height="240" rx="8" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><rect x="350" y="110" width="140" height="128" rx="8" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="420" y="160" fill="#5eead4" font-size="13" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">written by the</tspan><tspan x="420" dy="16">function (frames,</tspan><tspan x="420" dy="16">local arrays)</tspan></text><text x="420" y="290" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">still 0xA5...</tspan></text><text x="342" y="122" fill="#64748b" font-size="12" font-weight="400" text-anchor="end"><tspan x="342" dy="0">high</tspan></text><text x="342" y="350" fill="#64748b" font-size="12" font-weight="400" text-anchor="end"><tspan x="342" dy="0">low</tspan></text><text x="700" y="92" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">3. Scan for the first changed word</tspan></text><rect x="630" y="110" width="140" height="240" rx="8" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><rect x="630" y="110" width="140" height="128" rx="8" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="700" y="160" fill="#5eead4" font-size="13" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">written by the</tspan><tspan x="700" dy="16">function (frames,</tspan><tspan x="700" dy="16">local arrays)</tspan></text><text x="700" y="290" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">still 0xA5...</tspan></text><text x="622" y="122" fill="#64748b" font-size="12" font-weight="400" text-anchor="end"><tspan x="622" dy="0">high</tspan></text><text x="622" y="350" fill="#64748b" font-size="12" font-weight="400" text-anchor="end"><tspan x="622" dy="0">low</tspan></text><line x1="614" y1="238" x2="830" y2="238" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 5"/><text x="780" y="230" fill="#f87171" font-size="13" font-weight="700" text-anchor="start"><tspan x="780" dy="0">high-water mark</tspan></text><path d="M786 344 V250" stroke="#a8b5c7" stroke-width="2" marker-end="url(#a)"/><text x="796" y="300" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="796" dy="0">scan up</tspan></text><text x="38" y="384" fill="#a8b5c7" font-size="14" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Peak stack = initial SP minus the high-water mark. Run many messages: ML-DSA signing takes different paths.</tspan></text></g></svg>