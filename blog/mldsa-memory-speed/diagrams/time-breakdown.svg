<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 334" role="img" aria-labelledby="title desc"><title id="title">Time breakdown of ML-DSA-65</title><desc id="desc">Keccak takes 54% of key generation and 59% of verification but only 29% of signing; the rest of signing is lattice arithmetic.</desc><rect width="900" height="334" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#fb923c" font-size="18" font-weight="700" text-anchor="start"><tspan x="38" dy="0">WHERE THE TIME GOES  •  ML-DSA-65, portable C, sampled profile</tspan></text><text x="106" y="104" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="end"><tspan x="106" dy="0">keygen</tspan></text><rect x="120.0" y="80" width="399.1" height="36" rx="4" fill="#fdba74"/><text x="320.53999999999996" y="104" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="320.53999999999996" dy="0">54%</tspan></text><rect x="521.1" y="80" width="199.3" height="36" rx="4" fill="#c4b5fd"/><text x="621.7199999999999" y="104" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="621.7199999999999" dy="0">27%</tspan></text><rect x="722.4" y="80" width="29.1" height="36" rx="4" fill="#5eead4"/><rect x="753.4" y="80" width="94.2" height="36" rx="4" fill="#7dd3fc"/><text x="801.54" y="104" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="801.54" dy="0">13%</tspan></text><rect x="849.6" y="80" width="8.4" height="36" rx="4" fill="#64748b"/><text x="106" y="156" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="end"><tspan x="106" dy="0">sign</tspan></text><rect x="120.0" y="132" width="212.6" height="36" rx="4" fill="#fdba74"/><text x="227.3" y="156" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="227.3" dy="0">29%</tspan></text><rect x="334.6" y="132" width="26.9" height="36" rx="4" fill="#c4b5fd"/><rect x="363.5" y="132" width="128.2" height="36" rx="4" fill="#93c5fd"/><text x="428.58000000000004" y="156" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="428.58000000000004" dy="0">18%</tspan></text><rect x="493.7" y="132" width="86.8" height="36" rx="4" fill="#5eead4"/><text x="538.1" y="156" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="538.1" dy="0">12%</tspan></text><rect x="582.5" y="132" width="211.9" height="36" rx="4" fill="#7dd3fc"/><text x="689.4300000000001" y="156" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="689.4300000000001" dy="0">29%</tspan></text><rect x="796.4" y="132" width="61.6" height="36" rx="4" fill="#64748b"/><text x="828.1800000000001" y="156" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="828.1800000000001" dy="0">9%</tspan></text><text x="106" y="208" fill="#eef2f7" font-size="15" font-weight="700" text-anchor="end"><tspan x="106" dy="0">verify</tspan></text><rect x="120.0" y="184" width="432.4" height="36" rx="4" fill="#fdba74"/><text x="337.19" y="208" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="337.19" dy="0">59%</tspan></text><rect x="554.4" y="184" width="53.5" height="36" rx="4" fill="#c4b5fd"/><text x="582.13" y="208" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="582.13" dy="0">8%</tspan></text><rect x="609.9" y="184" width="79.4" height="36" rx="4" fill="#5eead4"/><text x="650.58" y="208" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="650.58" dy="0">11%</tspan></text><rect x="691.3" y="184" width="136.4" height="36" rx="4" fill="#7dd3fc"/><text x="760.47" y="208" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="760.47" dy="0">19%</tspan></text><rect x="829.7" y="184" width="28.3" height="36" rx="4" fill="#64748b"/><rect x="120" y="240" width="14" height="14" rx="3" fill="#fdba74"/><text x="140" y="252" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Keccak</tspan></text><rect x="207.6" y="240" width="14" height="14" rx="3" fill="#c4b5fd"/><text x="227.6" y="252" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="227.6" dy="0">sampling / unpack</tspan></text><rect x="378.79999999999995" y="240" width="14" height="14" rx="3" fill="#93c5fd"/><text x="398.79999999999995" y="252" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="398.79999999999995" dy="0">matrix-vector</tspan></text><rect x="519.5999999999999" y="240" width="14" height="14" rx="3" fill="#5eead4"/><text x="539.5999999999999" y="252" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="539.5999999999999" dy="0">NTT</tspan></text><rect x="120" y="264" width="14" height="14" rx="3" fill="#7dd3fc"/><text x="140" y="276" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="140" dy="0">main body (inlined invNTT, reduce, pack)</tspan></text><rect x="466.0" y="264" width="14" height="14" rx="3" fill="#64748b"/><text x="486.0" y="276" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="486.0" dy="0">other</tspan></text><text x="38" y="310" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="start"><tspan x="38" dy="0">mldsa-native (pure C), clang -O3, Apple M2, macOS sample. Keygen and verify are hash-bound; signing is arithmetic-bound.</tspan></text></g></svg>