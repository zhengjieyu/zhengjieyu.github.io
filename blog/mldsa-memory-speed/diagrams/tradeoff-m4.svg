<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Stack, time and code size of pqm4 ML-DSA-65 variants</title><desc id="desc">pqm4 clean uses 79.6 KB stack and 12.4 million cycles; m4f uses 68.9 KB and 6.2 million; m4fstack uses 6.6 KB but 24.4 million cycles and the most code.</desc><rect width="900" height="420" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#fb923c" font-size="18" font-weight="700" text-anchor="start"><tspan x="38" dy="0">ML-DSA-65 ON CORTEX-M4  •  stack vs signing time vs code (pqm4)</tspan></text><line x1="110.0" y1="80" x2="110.0" y2="350" stroke="#334155"/><text x="110.0" y="372" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="110.0" dy="0">0</tspan></text><line x1="276.66666666666663" y1="80" x2="276.66666666666663" y2="350" stroke="#334155"/><text x="276.66666666666663" y="372" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="276.66666666666663" dy="0">20</tspan></text><line x1="443.3333333333333" y1="80" x2="443.3333333333333" y2="350" stroke="#334155"/><text x="443.3333333333333" y="372" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="443.3333333333333" dy="0">40</tspan></text><line x1="610.0" y1="80" x2="610.0" y2="350" stroke="#334155"/><text x="610.0" y="372" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="610.0" dy="0">60</tspan></text><line x1="776.6666666666666" y1="80" x2="776.6666666666666" y2="350" stroke="#334155"/><text x="776.6666666666666" y="372" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="middle"><tspan x="776.6666666666666" dy="0">80</tspan></text><line x1="110" y1="350.0" x2="860" y2="350.0" stroke="#334155"/><text x="100" y="355.0" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="end"><tspan x="100" dy="0">0</tspan></text><line x1="110" y1="282.5" x2="860" y2="282.5" stroke="#334155"/><text x="100" y="287.5" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="end"><tspan x="100" dy="0">7</tspan></text><line x1="110" y1="215.0" x2="860" y2="215.0" stroke="#334155"/><text x="100" y="220.0" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="end"><tspan x="100" dy="0">14</tspan></text><line x1="110" y1="147.5" x2="860" y2="147.5" stroke="#334155"/><text x="100" y="152.5" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="end"><tspan x="100" dy="0">21</tspan></text><line x1="110" y1="80.0" x2="860" y2="80.0" stroke="#334155"/><text x="100" y="85.0" fill="#a8b5c7" font-size="13" font-weight="400" text-anchor="end"><tspan x="100" dy="0">28</tspan></text><text x="485.0" y="402" fill="#a8b5c7" font-size="14" font-weight="400" text-anchor="middle"><tspan x="485.0" dy="0">signing stack peak (KB)</tspan></text><text x="30" y="215.0" fill="#a8b5c7" font-size="14" font-weight="400" text-anchor="middle"><tspan x="30" dy="0">Mcycles</tspan></text><circle cx="773.3333333333333" cy="230.81428571428575" r="9" fill="#64748b"/><text x="761.3333333333333" y="204.81428571428575" fill="#eef2f7" font-size="14" font-weight="400" text-anchor="end"><tspan x="761.3333333333333" dy="0">clean (portable C)</tspan><tspan x="761.3333333333333" dy="18">code 7.7 KB</tspan></text><circle cx="684.1666666666667" cy="290.3107142857143" r="9" fill="#fdba74"/><text x="672.1666666666667" y="316.3107142857143" fill="#eef2f7" font-size="14" font-weight="400" text-anchor="end"><tspan x="672.1666666666667" dy="0">m4f (assembly)</tspan><tspan x="672.1666666666667" dy="18">code 19.3 KB</tspan></text><circle cx="165.0" cy="114.52142857142854" r="9" fill="#5eead4"/><text x="181.0" y="118.52142857142854" fill="#eef2f7" font-size="14" font-weight="400" text-anchor="start"><tspan x="181.0" dy="0">m4fstack (low stack)</tspan><tspan x="181.0" dy="18">code 24.1 KB</tspan></text><text x="110" y="66" fill="#a8b5c7" font-size="13" font-weight="40