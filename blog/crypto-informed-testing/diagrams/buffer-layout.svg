<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Test 7 buffer layout</title><desc id="desc">One guard byte, the ciphertext labelled DIFF including the four padding bits of its last byte, and one trailing guard byte. Decaps receives a pointer to the second byte. Flipping a guard bit must leave the key unchanged; flipping any ciphertext bit, padding included, must change it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker></defs><rect width="900" height="360" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="48" fill="#fb923c" font-size="18" font-weight="700">TEST 7  •  fmt = [(8, EQ), (|c|, DIFF), (8, EQ)]</text><rect x="40" y="110" width="110" height="80" rx="10" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="95" y="146" fill="#5eead4" font-size="20" font-weight="700" text-anchor="middle">0xFF</text><text x="95" y="172" fill="#a8b5c7" font-size="14" text-anchor="middle">guard · EQ</text><rect x="160" y="110" width="430" height="80" rx="10" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><text x="375" y="146" fill="#93c5fd" font-size="20" font-weight="700" text-anchor="middle">c[0] … c[len−2]</text><text x="375" y="172" fill="#a8b5c7" font-size="14" text-anchor="middle">packed coefficients · DIFF</text><rect x="600" y="110" width="140" height="80" rx="10" fill="#1d2a3d" stroke="#93c5fd" stroke-width="2"/><line x1="670" y1="118" x2="670" y2="154" stroke="#334155" stroke-width="2"/><text x="635" y="146" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">4 data</text><text x="705" y="146" fill="#fb923c" font-size="15" font-weight="700" text-anchor="middle">4 pad</text><text x="670" y="172" fill="#a8b5c7" font-size="14" text-anchor="middle">c[len−1] · DIFF</text><rect x="750" y="110" width="110" height="80" rx="10" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="805" y="146" fill="#5eead4" font-size="20" font-weight="700" text-anchor="middle">0xFF</text><text x="805" y="172" fill="#a8b5c7" font-size="14" text-anchor="middle">guard · EQ</text><path d="M160 70 L160 104" stroke="#fb923c" stroke-width="3" marker-end="url(#a)"/><text x="174" y="80" fill="#fb923c" font-size="15" font-weight="700">&amp;x[1] is passed to Decaps</text><text x="40" y="236" fill="#5eead4" font-size="16" font-weight="700">flip a guard bit</text><text x="210" y="236" fill="#a8b5c7" font-size="16">key must stay the same, otherwise Decaps reads outside c</text><text x="40" y="266" fill="#93c5fd" font-size="16" font-weight="700">flip a ciphertext bit</text><text x="210" y="266" fill="#a8b5c7" font-size="16">key must change, otherwise IND-CCA is broken</text><rect x="40" y="290" width="820" height="46" rx="12" fill="#2a1f14" stroke="#7c4a12" stroke-width="2"/><text x="60" y="319" fill="#fdba74" font-size="15">NTRU in LibOQS 0.4.0: the 4 padding bits were never checked, so the flipped ciphertext gave the same key</text></g></svg>
