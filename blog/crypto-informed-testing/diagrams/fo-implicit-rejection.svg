<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">FO implicit rejection and the unused z</title><desc id="desc">ML-KEM decapsulation decrypts c to m', derives K' from G(m' || h), re-encrypts to c', and compares c with c'. The rejection key J(z || c) is always computed but only selected when c differs from c', so for a valid ciphertext changing z does not change the output.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs><rect width="900" height="380" rx="22" fill="#111827"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="48" fill="#fb923c" font-size="18" font-weight="700">FO IMPLICIT REJECTION  •  WHY TEST 6 FIRES ON CORRECT KEMs</text><rect x="40" y="96" width="90" height="56" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="85" y="131" fill="#eef2f7" font-size="20" font-weight="700" text-anchor="middle">c</text><rect x="170" y="96" width="150" height="56" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="245" y="130" fill="#93c5fd" font-size="17" font-weight="700" text-anchor="middle">Decrypt → m′</text><rect x="360" y="96" width="150" height="56" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="435" y="130" fill="#93c5fd" font-size="17" font-weight="700" text-anchor="middle">G(m′ ‖ h)</text><rect x="550" y="96" width="150" height="56" rx="12" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="625" y="130" fill="#93c5fd" font-size="17" font-weight="700" text-anchor="middle">Encrypt → c′</text><path d="M132 124 L166 124" stroke="#fb923c" stroke-width="3" marker-end="url(#a)"/><path d="M322 124 L356 124" stroke="#fb923c" stroke-width="3" marker-end="url(#a)"/><path d="M512 124 L546 124" stroke="#fb923c" stroke-width="3" marker-end="url(#a)"/><text x="530" y="112" fill="#a8b5c7" font-size="13" text-anchor="middle">r′</text><rect x="740" y="96" width="120" height="56" rx="12" fill="#283343" stroke="#334155" stroke-width="2"/><text x="800" y="130" fill="#eef2f7" font-size="17" font-weight="700" text-anchor="middle">c = c′ ?</text><path d="M702 124 L736 124" stroke="#fb923c" stroke-width="3" marker-end="url(#a)"/><path d="M435 154 L435 214" stroke="#5eead4" stroke-width="3" marker-end="url(#a)"/><text x="447" y="190" fill="#5eead4" font-size="14">K′</text><rect x="360" y="218" width="300" height="56" rx="12" fill="#123236" stroke="#5eead4" stroke-width="2"/><text x="510" y="252" fill="#5eead4" font-size="17" font-weight="700" text-anchor="middle">output = c = c′ ? K′ : K̄</text><path d="M800 154 L800 246 L664 246" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="812" y="204" fill="#a8b5c7" font-size="13">select</text><rect x="40" y="218" width="250" height="56" rx="12" fill="#1f2430" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/><text x="165" y="252" fill="#94a3b8" font-size="17" font-weight="700" text-anchor="middle">K̄ = J(z ‖ c)</text><path d="M292 246 L356 246" stroke="#64748b" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#g)"/><text x="40" y="314" fill="#a8b5c7" font-size="15">Valid c: c = c′, so the output is K′. K̄ is computed for constant time and then discarded.</text><text x="40" y="340" fill="#a8b5c7" font-size="15">Flipping any bit of z leaves the output unchanged: a "malleable" secret key, by design.</text></g></svg>
