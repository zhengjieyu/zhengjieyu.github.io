<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">The metamorphic Test loop</title><desc id="desc">GenInput produces a valid input and its baseline output. Each iteration, Maul flips one bit and states whether the output should be equal or different, Call reruns the function, and Match aborts on a mismatch so that AFL++ stores the input.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect width="900" height="400" rx="22" fill="#111827"/><text x="38" y="48" fill="#fb923c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TEST LOOP  •  Φ = (GenInput, Call, Maul, Match)</text><g font-family="Arial, Helvetica, sans-serif"><rect x="40" y="90" width="180" height="96" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="130" y="122" fill="#93c5fd" font-size="19" font-weight="700" text-anchor="middle">GenInput</text><text x="130" y="150" fill="#a8b5c7" font-size="15" text-anchor="middle">valid input x</text><text x="130" y="171" fill="#a8b5c7" font-size="15" text-anchor="middle">baseline y = Π(x)</text><rect x="270" y="90" width="180" height="96" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="360" y="122" fill="#93c5fd" font-size="19" font-weight="700" text-anchor="middle">Maul</text><text x="360" y="150" fill="#a8b5c7" font-size="15" text-anchor="middle">flip bit σ → x′</text><text x="360" y="171" fill="#a8b5c7" font-size="15" text-anchor="middle">label → EQ / DIFF</text><rect x="500" y="90" width="160" height="96" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="580" y="122" fill="#93c5fd" font-size="19" font-weight="700" text-anchor="middle">Call</text><text x="580" y="150" fill="#a8b5c7" font-size="15" text-anchor="middle">y′ = Π(x′)</text><text x="580" y="171" fill="#a8b5c7" font-size="15" text-anchor="middle">data + return value</text><rect x="710" y="90" width="150" height="96" rx="14" fill="#283343" stroke="#334155" stroke-width="2"/><text x="785" y="122" fill="#eef2f7" font-size="19" font-weight="700" text-anchor="middle">Match</text><text x="785" y="150" fill="#a8b5c7" font-size="15" text-anchor="middle">(y = y′)</text><text x="785" y="171" fill="#a8b5c7" font-size="15" text-anchor="middle">== expected ?</text><path d="M222 138 L266 138" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M452 138 L496 138" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M662 138 L706 138" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M785 188 L785 238 L360 238 L360 192" stroke="#5eead4" stroke-width="3" fill="none" marker-end="url(#t)"/><text x="572" y="230" fill="#5eead4" font-size="16" font-weight="700" text-anchor="middle">as expected: σ ← σ + 1, next bit</text><path d="M860 138 L878 138 L878 300 L790 300" stroke="#f87171" stroke-width="3" fill="none" marker-end="url(#r)"/><rect x="560" y="268" width="226" height="64" rx="14" fill="#3b1d24" stroke="#7f1d1d" stroke-width="2"/><text x="673" y="296" fill="#fca5a5" font-size="17" font-weight="700" text-anchor="middle">mismatch → abort()</text><text x="673" y="320" fill="#a8b5c7" font-size="14" text-anchor="middle">AFL++ stores x, fmt, σ</text><text x="40" y="286" fill="#a8b5c7" font-size="15">EQ region changed the output  → over-read</text><text x="40" y="312" fill="#a8b5c7" font-size="15">DIFF region did not change it  → malleable</text><text x="40" y="338" fill="#a8b5c7" font-size="15">crash or hang under tampering  → memory bug</text><text x="40" y="372" fill="#64748b" font-size="13">σ starts at −3 (unchanged), −2 (all zeros), −1 (all ones), then single bit flips</text></g></svg>
