<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Pavona execution path</title><desc id="desc">Ibex prepares a program and inputs; ACC executes using IMEM and DMEM; KMAC provides SHA3 and SHAKE.</desc><rect width="1000" height="430" rx="22" fill="#111827"/><text x="38" y="48" fill="#fb923c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">ONE CRYPTOGRAPHIC OPERATION</text><rect x="42" y="90" width="250" height="255" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="72" y="136" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">Ibex</text><text x="72" y="168" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Main processor / firmware</text><text x="72" y="224" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">1  Load ACC program</text><text x="72" y="258" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">2  Write input to DMEM</text><text x="72" y="292" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">3  Start and wait</text><path d="M302 218 L360 218" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M350 211 L360 218 L350 225" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="90" width="375" height="255" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="400" y="136" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">ACC</text><text x="400" y="168" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start">Cryptographic coprocessor</text><rect x="398" y="195" width="144" height="68" rx="10" fill="#172638" stroke="#334155" stroke-width="2"/><text x="470" y="235" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">IMEM</text><rect x="562" y="195" width="144" height="68" rx="10" fill="#172638" stroke="#334155" stroke-width="2"/><text x="634" y="235" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">DMEM</text><text x="400" y="311" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start">GPR  •  WDR  •  custom ISA</text><path d="M753 218 L807 218" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M797 211 L807 218 L797 225" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="816" y="130" width="145" height="175" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="888" y="185" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">KMAC</text><text x="888" y="219" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="middle">SHA-3</text><text x="888" y="246" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="middle">SHAKE</text><text x="43" y="395" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start">ACC finishes → interrupt → Ibex reads the result</text></svg>