<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">BN.ADDM modular addition</title><desc id="desc">13 plus 9 equals 22; with modulus 17, one subtraction gives 5.</desc><rect width="900" height="340" rx="22" fill="#111827"/><text x="38" y="48" fill="#fb923c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">BN.ADDM  •  MODULAR ADDITION</text><rect x="44" y="92" width="170" height="105" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="62" y="120" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">w10</text><text x="129" y="170" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" text-anchor="middle">13</text><rect x="254" y="92" width="170" height="105" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="272" y="120" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">w11</text><text x="339" y="170" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" text-anchor="middle">9</text><rect x="623" y="92" width="170" height="105" rx="14" fill="#1d2a3d" stroke="#334155" stroke-width="2"/><text x="641" y="120" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">MOD</text><text x="708" y="170" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" text-anchor="middle">17</text><text x="227" y="160" fill="#fb923c" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">+</text><path d="M428 145 L488 145" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M478 138 L488 145 L478 152" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="92" width="110" height="105" rx="14" fill="#283343" stroke="#334155" stroke-width="2"/><text x="555" y="160" fill="#eef2f7" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle">22</text><text x="300" y="252" fill="#a8b5c7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">22 ≥ 17 → subtract 17</text><path d="M557 204 L557 268" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M550 258 L557 268 L564 258" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="365" y="275" width="385" height="45" rx="10" fill="#153d3e" stroke="#2f766c" stroke-width="2"/><text x="557" y="305" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">w13 = 5</text></svg>