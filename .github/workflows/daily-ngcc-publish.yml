name: Publish NGCC Explorer data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ngcc-site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out personal site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out Explorer source
        uses: actions/checkout@v4
        with:
          repository: zhengjieyu/ngcc-benchmark-explorer
          path: explorer
          persist-credentials: false

      - name: Check out latest published harness
        uses: actions/checkout@v4
        with:
          repository: ngcc-dev/ngcc-harness
          path: harness
          persist-credentials: false

      - name: Check deployed source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git -C harness rev-parse HEAD)
          published=$(python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('site/ngcc-explorer/data-version.json')
          print(json.loads(path.read_text()).get('source_commit', '') if path.exists() else '')
          PY
          )
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$latest" != "$published" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo "Site already uses harness commit $latest."
          fi

      - name: Import latest results
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current=$(python3 -c 'import json; print(json.load(open("explorer/data/normalized.json"))["source_commit"])')
          if [[ "$current" != '${{ steps.source.outputs.latest }}' ]]; then
            python3 explorer/scripts/sync_ngcc.py --source harness --commit '${{ steps.source.outputs.latest }}'
          fi

      - name: Install Node.js
        if: steps.source.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Validate and build site
        if: steps.source.outputs.changed == 'true'
        working-directory: explorer
        run: |
          python3 scripts/validate_dataset.py --commit '${{ steps.source.outputs.latest }}'
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm ci
          npm test
          npm run check
          npm run build

      - name: Publish verified build
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/ngcc-explorer
          mkdir -p site/ngcc-explorer
          cp -a explorer/build/. site/ngcc-explorer/
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('explorer/data/normalized.json').read_text())
          metadata = {key: data[key] for key in ('source_commit', 'synced_utc')}
          metadata['record_count'] = len(data['records'])
          Path('site/ngcc-explorer/data-version.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add ngcc-explorer
          if git -C site diff --cached --quiet; then
            echo 'No published change.'
          else
            git -C site commit -m "Publish NGCC harness data (${{ steps.source.outputs.latest }})"
            git -C site push
          fi

      - name: Request GitHub Pages build
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
